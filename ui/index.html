<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OceanTrace — Satellite SAR Oil-Spill Intelligence & AIS Attribution</title>

  <!-- Typography: Newsreader (Editorial Serif), Plus Jakarta Sans (Clean Modern Sans), JetBrains Mono (Data Tabular) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Leaflet CSS for Maritime GIS Mapping -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

  <!-- OceanTrace Custom Design System (60:30:10 Warm Ivory / Deep Editorial Blue / Coral Orange) -->
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="app">
    <!-- Top Maritime Surveillance Header -->
    <header class="site-header">
      <!-- Brand & Project Identity -->
      <div class="brand-wrapper">
        <div class="brand-badge">
          <i data-lucide="waves" style="width: 18px; height: 18px;"></i>
        </div>
        <div>
          <div style="display: flex; align-items: center; gap: 0.5rem;">
            <span class="brand-name">OceanTrace</span>
            <span class="brand-tag">SIH 2026 · PS-26143</span>
          </div>
        </div>
      </div>

      <!-- Core Workflow Tabs (Only 3 Required Screens) -->
      <nav class="nav-tabs" aria-label="Workflow Navigation">
        <button class="nav-tab-btn active" data-view="monitor">
          <span class="tab-num">1</span>
          Surveillance Monitor
        </button>
        <button class="nav-tab-btn" data-view="forensics">
          <span class="tab-num">2</span>
          Drift Forensics
        </button>
        <button class="nav-tab-btn" data-view="attribution">
          <span class="tab-num">3</span>
          Vessel Attribution
        </button>
      </nav>

      <!-- Right Telemetry & Live Clock -->
      <div class="header-telemetry">
        <div class="telemetry-item">
          <span class="telemetry-label">Backend API</span>
          <span id="backend-status-container" class="telemetry-val" style="display: flex; align-items: center; gap: 0.35rem;">
            <span id="backend-status-pill" class="status-pill live" style="padding: 0.15rem 0.45rem;">
              <span class="pulse-dot"></span> Connecting...
            </span>
          </span>
        </div>
        <div class="telemetry-item">
          <span class="telemetry-label">Copernicus SAR</span>
          <span class="telemetry-val" style="display: flex; align-items: center; gap: 0.35rem;">
            <span class="status-pill live" style="padding: 0.15rem 0.45rem;">
              <span class="pulse-dot"></span> Live Orbit
            </span>
          </span>
        </div>
        <div class="telemetry-item">
          <span class="telemetry-label">Mission Time</span>
          <span id="utc-clock" class="telemetry-val">00:00:00 UTC</span>
        </div>
      </div>
    </header>

    <!-- Main Viewport Router Container -->
    <main class="main-content" id="view-viewport"></main>
  </div>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <!-- Leaflet GIS Map Engine -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Application Logic -->
  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/components/monitor.js"></script>
  <script src="js/components/forensics.js"></script>
  <script src="js/components/attribution.js"></script>
  <script src="js/components/dossierModal.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
