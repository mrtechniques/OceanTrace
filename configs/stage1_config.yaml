# ============================================================
# OceanTrace — Stage 1 Pipeline Configuration
# ============================================================

project:
  name: OceanTrace
  version: "0.1.0"
  stage: 1

# --- SAR Preprocessing ---
preprocessing:
  # Radiometric calibration output type: "sigma0" | "beta0" | "gamma0"
  calibration_output: "sigma0"

  # Speckle filter: "lee" | "refined_lee" | "frost" | "gamma_map"
  speckle_filter: "refined_lee"
  speckle_window_size: 7

  # Terrain correction DEM (used by SNAP; "SRTM 3Sec" is default)
  dem: "SRTM 3Sec"

  # Output pixel spacing in metres after terrain correction
  pixel_spacing_m: 10.0

# --- Image Chipping (Matched to Model Input) ---
chipping:
  # Chip size fed to the segmentation model (pixels)
  chip_size: 256
  # Overlap between adjacent chips (pixels)
  overlap: 32
  # Channels: 3 (RGB format expected by ResNet34 encoder)
  channels: 3
  # Normalisation strategy: "minmax" | "percentile" | "imagenet"
  normalization: "percentile"
  percentile_low: 2
  percentile_high: 98

# --- Segmentation Model: U-Net with ResNet34 Encoder ---
segmentation:
  # Architecture: U-Net with ResNet34 backbone
  framework: "pytorch"
  architecture: "unet_resnet34"
  encoder: "resnet34"
  in_channels: 3
  num_classes: 2
  classes:
    0: "background"
    1: "oil_spill"
  # Target checkpoint path inside models/checkpoints/
  weights: "models/checkpoints/unet_resnet34_oilspill.pth"
  # Inference threshold (sigmoid/softmax probability threshold for class 1)
  prob_threshold: 0.50
  device: "cpu"  # Automatically switches to "cuda" if GPU is available
  imgsz: 256

# --- Postprocessing ---
postprocessing:
  # Minimum spill area to retain (m²) — smaller patches treated as speckle noise
  min_area_m2: 5000
  # Morphological closing kernel size (pixels)
  closing_kernel_size: 5
  # Output CRS EPSG for geometric properties
  output_crs_epsg: 4326

# --- Paths (relative to repo root) ---
paths:
  raw_sar_dir: "data/raw/sar"
  processed_mask_dir: "data/processed/masks"
  processed_features_dir: "data/processed/features"
  model_checkpoint_dir: "models/checkpoints"
  logs_dir: "logs"
